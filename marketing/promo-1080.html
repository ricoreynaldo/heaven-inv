  .card { position: absolute; width: 250px; aspect-ratio: 4 / 5; padding: 6px; background: #fff;

  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .k2 { left: 66px;  top: 180px; rotate: -4.5deg; }
  .k3 { left: 114px; top: 220px; rotate: 1.5deg; }
  .k4 { left: 160px; top: 258px; rotate: 7deg; }

  .title { position: absolute; left: 108px; top: 126px; z-index: 3; font: 800 128px/.84 'Plus Jakarta Sans', sans-serif; letter-spacing: -.055em; }
  .title span { display: block; }
  .side-word { position: absolute; z-index: 3; left: 772px; top: 812px; transform-origin: 0 0; rotate: -90deg;
    font: 800 100px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: -.05em; }
  .v-left { position: absolute; left: 66px; top: 812px; transform-origin: 0 0; rotate: -90deg; white-space: nowrap;
    font: 500 19px/1 'Geist', sans-serif; letter-spacing: .02em; }
  .v-right { position: absolute; left: 1018px; top: 250px; transform-origin: 0 0; rotate: 90deg; white-space: nowrap;
    display: flex; align-items: center; gap: 16px; font: 500 19px/1 'Geist', sans-serif; }

  .cats i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .desc { margin-top: 14px; font: 400 18px/1.45 'Geist', sans-serif; color: var(--soft); }
  .url { margin-top: 18px; font: 700 26px/1 'Plus Jakarta Sans', sans-serif; letter-spacing: -.02em; }
  .wa { margin-top: 10px; font: 500 19px/1 'Geist', sans-serif; }
  .qr { flex: none; text-align: center; }
  .qr-box { width: 150px; height: 150px; padding: 10px; border: 1.5px solid var(--line); }
  .qr-svg { width: 100%; height: 100%; display: block; }
  .qr small { display: block; margin-top: 8px; font: 500 13px/1 'Geist', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
